name: Dice

on:
  issues:
    types: [opened]

# Only the roll job may write; nothing here runs code from the issue.
permissions:
  contents: write
  issues: write

concurrency:
  group: dice
  cancel-in-progress: false

jobs:
  roll:
    if: startsWith(github.event.issue.title, 'roll:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Roll
        id: roll
        env:
          # Passed as environment values, never interpolated into a shell line.
          TITLE: ${{ github.event.issue.title }}
          ACTOR: ${{ github.event.issue.user.login }}
        run: node .github/scripts/roll.mjs

      - name: Commit the new state
        id: commit
        env:
          TITLE: ${{ github.event.issue.title }}
          ACTOR: ${{ github.event.issue.user.login }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The remote can move between checkout and push: a person pushing, or
          # a roll that landed first. A rebase here would quietly reapply this
          # roll on top of a chronicle it was not computed from, overwriting
          # whoever got there first. So the roll is thrown away and replayed
          # against the state that actually won.
          for attempt in 1 2 3; do
            git add README.md assets/last-roll.svg assets/descent.svg .github/chronicle.json
            git reset -q .github/roll-reply.md 2>/dev/null || true

            if git diff --staged --quiet; then
              echo "nothing changed, so nothing to push"
              exit 0
            fi

            git commit -q -m "chronicle: the party moves"

            if git push -q origin "HEAD:$BRANCH"; then
              echo "landed on attempt $attempt"
              exit 0
            fi

            echo "push rejected, the remote moved. Replaying the roll on top of it."
            git reset --hard -q HEAD~1
            git fetch -q origin "$BRANCH"
            git reset --hard -q "origin/$BRANCH"
            node .github/scripts/roll.mjs
          done

          echo "could not land the roll after 3 attempts" >&2
          exit 1

      # Always runs, even when the commit above failed. Whoever opened the
      # issue gets an answer either way: silence was the old failure mode.
      - name: Answer and close the issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          LANDED: ${{ steps.commit.outcome }}
        run: |
          # `gh issue close` has no --body-file; only `gh issue comment` does.
          if [ ! -f .github/roll-reply.md ]; then
            gh issue comment "$NUMBER" --repo "$REPO" \
              --body "That roll was not accepted. The issue title has to be exactly \`roll:d20\`."
          elif [ "$LANDED" = "success" ]; then
            gh issue comment "$NUMBER" --repo "$REPO" --body-file .github/roll-reply.md
          else
            gh issue comment "$NUMBER" --repo "$REPO" \
              --body "The die was thrown, but the chronicle would not take it: the repository moved while this was running, three times over. Nothing was lost. Roll again."
          fi
          gh issue close "$NUMBER" --repo "$REPO"
