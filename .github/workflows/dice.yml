name: Dice

on:
  issues:
    types: [opened]

# Only the roll job may write; nothing here runs code from the issue.
permissions:
  contents: write
  issues: write

concurrency:
  group: dice
  cancel-in-progress: false

jobs:
  roll:
    if: startsWith(github.event.issue.title, 'roll:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Roll
        id: roll
        env:
          # Passed as environment values, never interpolated into a shell line.
          TITLE: ${{ github.event.issue.title }}
          ACTOR: ${{ github.event.issue.user.login }}
        run: node .github/scripts/roll.mjs

      - name: Commit the new state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/last-roll.svg assets/descent.svg .github/chronicle.json
          git reset -q .github/roll-reply.md 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "chronicle: the party moves"
          git push

      - name: Close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          # `gh issue close` has no --body-file; only `gh issue comment` does.
          # Comment first, then close, so the reply survives either way.
          if [ -f .github/roll-reply.md ]; then
            gh issue comment "$NUMBER" --repo "$REPO" --body-file .github/roll-reply.md
          else
            gh issue comment "$NUMBER" --repo "$REPO" \
              --body "That roll was not accepted — the issue title has to be exactly \`roll:d20\`."
          fi
          gh issue close "$NUMBER" --repo "$REPO"
