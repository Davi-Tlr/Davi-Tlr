<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 330" width="380" height="330" role="img" aria-label="The Forgotten Cistern of the Quiet King: party on level 0 of 4, 3 torches lit, 0 won and 0 lost">
