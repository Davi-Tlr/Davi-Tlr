<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Davi Lucas — software developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#11161f"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="routeGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="55%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#39d353"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d"/>
    </pattern>

    <clipPath id="frame">
      <rect width="1000" height="220" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="220" fill="url(#bg)"/>
    <rect width="1000" height="220" fill="url(#grid)" opacity="0.5"/>

    <!-- flight route: climbs left to right, clearing the text block -->
    <path id="route" d="M 60 188 L 270 155 L 500 140 L 730 92 L 950 72"
          stroke="url(#routeGrad)" stroke-width="2.5" fill="none"
          stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="1100" stroke-dashoffset="1100">
      <animate attributeName="stroke-dashoffset" from="1100" to="0" dur="2.8s"
               begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
    </path>

    <!-- waypoints -->
    <g fill="#0d1117" stroke="#58a6ff" stroke-width="2">
      <circle cx="60"  cy="188" r="4" opacity="0">
        <animate attributeName="opacity" to="1" dur="0.3s" begin="0.4s" fill="freeze"/>
      </circle>
      <circle cx="270" cy="155" r="4" opacity="0">
        <animate attributeName="opacity" to="1" dur="0.3s" begin="0.9s" fill="freeze"/>
      </circle>
      <circle cx="500" cy="140" r="4" opacity="0">
        <animate attributeName="opacity" to="1" dur="0.3s" begin="1.5s" fill="freeze"/>
      </circle>
      <circle cx="730" cy="92"  r="4" opacity="0">
        <animate attributeName="opacity" to="1" dur="0.3s" begin="2.1s" fill="freeze"/>
      </circle>
      <circle cx="950" cy="72"  r="4.5" fill="#39d353" stroke="#39d353" opacity="0">
        <animate attributeName="opacity" to="1" dur="0.3s" begin="2.7s" fill="freeze"/>
        <animate attributeName="r" values="4.5;8;4.5" dur="2.4s" begin="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- aircraft tracking the route -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" dur="3.1s" begin="0.2s" fill="freeze"/>
      <circle r="16" fill="url(#glow)">
        <animateMotion dur="2.8s" begin="0.2s" fill="freeze" rotate="auto"
                       calcMode="spline" keySplines="0.3 0 0.2 1">
          <mpath href="#route"/>
        </animateMotion>
      </circle>
      <path d="M -6 -4 L 7 0 L -6 4 L -3 0 Z" fill="#e6edf3">
        <animateMotion dur="2.8s" begin="0.2s" fill="freeze" rotate="auto"
                       calcMode="spline" keySplines="0.3 0 0.2 1">
          <mpath href="#route"/>
        </animateMotion>
      </path>
    </g>

    <!-- name -->
    <text x="60" y="88" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace"
          font-size="36" font-weight="600" fill="#e6edf3" letter-spacing="1" opacity="0">
      Davi Lucas
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.6s" fill="freeze"/>
    </text>

    <!-- tagline: cursor is a tspan, so it always sits flush after the text -->
    <text x="62" y="118" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace"
          font-size="17" fill="#9aa3ad" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.6s" fill="freeze"/>
      <tspan fill="#39d353">&gt;</tspan> I build the tools I need myself<tspan fill="#39d353" opacity="0">&#9608;<animate
        attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="2.5s" repeatCount="indefinite"/></tspan>
    </text>

    <rect width="1000" height="220" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>
  </g>
</svg>
