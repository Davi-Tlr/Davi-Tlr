<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 165" width="240" height="165" role="img" aria-label="A d20 waiting for its first roll">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22"/><stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="lift" cx="0.5" cy="0.35">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="165" rx="10" fill="url(#plate)" stroke="#30363d" stroke-width="1.5"/>
  <rect width="240" height="165" rx="10" fill="url(#lift)"/>

  <g transform="translate(120 72)">
    
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3;3;-3" dur="6s" repeatCount="indefinite" additive="sum"/>
      
      <polygon points="0,-31 -27.5,-47.6 27.5,-47.6" fill="#2b3a50" stroke="#58a6ff" stroke-width="0.7" stroke-opacity="0.3" stroke-linejoin="round"/>
      <polygon points="0,-31 27.5,-47.6 55,0" fill="#253248" stroke="#58a6ff" stroke-width="0.7" stroke-opacity="0.3" stroke-linejoin="round"/>
      <polygon points="0,-31 55,0 27.5,17" fill="#202c40" stroke="#58a6ff" stroke-width="0.7" stroke-opacity="0.3" stroke-linejoin="round"/>
      <polygon points="27.5,17 55,0 27.5,47.6" fill="#1a2434" stroke="#58a6ff" stroke-width="0.7" stroke-opacity="0.3" stroke-linejoin="round"/>
      <polygon points="27.5,17 27.5,47.6 -27.5,47.6" fill="#151d2b" stroke="#58a6ff" stroke-width="0.7" stroke-opacity="0.3" stroke-linejoin="round"/>
      <polygon points="27.5,17 -27.5,47.6 -27.5,17" fill="#172030" stroke="#58a6ff" stroke-width="0.7" stroke-opacity="0.3" stroke-linejoin="round"/>
      <polygon points="-27.5,17 -27.5,47.6 -55,0" fill="#1c2636" stroke="#58a6ff" stroke-width="0.7" stroke-opacity="0.3" stroke-linejoin="round"/>
      <polygon points="-27.5,17 -55,0 -27.5,-47.6" fill="#222f43" stroke="#58a6ff" stroke-width="0.7" stroke-opacity="0.3" stroke-linejoin="round"/>
      <polygon points="-27.5,17 -27.5,-47.6 0,-31" fill="#27354c" stroke="#58a6ff" stroke-width="0.7" stroke-opacity="0.3" stroke-linejoin="round"/>
      <polygon points="0,-31 27.5,17 -27.5,17" fill="#1c2534" stroke="#58a6ff" stroke-width="1.4" stroke-opacity="0.9" stroke-linejoin="round"/>
    </g>
    <g>
      
      <text y="13" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="36" font-weight="600" fill="#e6edf3" opacity="0.9">?</text>
    </g>
  </g>

  <text x="120" y="140" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#58a6ff" letter-spacing="1.6" opacity="0.9">ROLL ME</text>
  <text x="120" y="154" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="9.5" fill="#6e7681">no rolls yet</text>
</svg>
